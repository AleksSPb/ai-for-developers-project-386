name: CI

# Тесты и линтер на каждый push. Отдельный от hexlet-check.yml workflow:
# тот трогать нельзя (см. AGENTS.md), он гоняет тесты Хекслета.
on:
  push:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        # package.json живёт в vite-project/, в корне репозитория его нет
        working-directory: vite-project
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vite-project/package-lock.json

      - name: Установка зависимостей
        run: npm ci

      - name: Линтер
        run: npm run lint

      - name: Тесты
        run: npm run test
