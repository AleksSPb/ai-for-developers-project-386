name: release-please

# Запускается вручную, когда есть желание зарелизить: Actions → release-please → Run workflow.
# Корневого package.json нет намеренно — версия живёт в vite-project/package.json.
#
# Один релиз — два ручных прогона:
#   1. запуск → создаёт/обновляет release-PR;
#   2. после мержа release-PR → запуск снова → createPullRequests() прерывается
#      («untagged, merged release PRs outstanding»), а createReleases() находит
#      смерженный PR с меткой autorelease: pending и ставит тег + GitHub Release.
# Автотриггера на push в main нет, поэтому без второго запуска тег не появится.
#
# В release-please-config.json сейчас стоит ВРЕМЕННЫЙ `last-release-sha` на коммит
# `v0.0.1`: он переносит уже выпущенный тег `v0.0.1` на схему с компонентом в имени
# (`vite-project-v…`, `server-v…`), иначе release-please не найдёт прошлый релиз.
# Снять ключ после того, как первый релизный PR смержен и теги поставлены.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # release-type не указан: при наличии release-please-config.json
      # включается манифестный режим автоматически
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
